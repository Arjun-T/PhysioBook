<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PhysioConnect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="landing">

  <div class="container">

    <h1 class="logo">PhysioConnect</h1>
    <p class="tagline">Physiotherapy, simplified.</p>

    <!-- ROLE SELECTION -->
    <div id="roleSelect" class="card-grid">
      <div class="choice-card" onclick="selectRole('user')">
        <h2>I need therapy</h2>
        <p>Find certified physiotherapists near you</p>
      </div>

      <div class="choice-card dark" onclick="selectRole('physio')">
        <h2>I do therapy</h2>
        <p>Grow your practice and manage bookings</p>
      </div>
    </div>

    <!-- AUTH FORM -->
    <form id="authForm" class="auth-form" style="display:none;">
      <input type="text" id="name" placeholder="Full name" required />
      <input type="email" id="email" placeholder="Email address" required />
      <input type="password" id="password" placeholder="Password" required />

      <button class="primary-btn">Continue</button>
      <p class="hint">New users will be registered automatically</p>
    </form>

  </div>

  <script src="firebase.js"></script>
  <script src="auth.js"></script>
</body>
</html>
