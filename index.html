<!DOCTYPE html>
<html>
<head>
  <title>PhysioConnect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="landing">

  <div class="landing-container">
    <h1>🧠 PhysioConnect</h1>
    <p class="subtitle">Professional physiotherapy, when you need it</p>

    <div class="role-cards">
      <div class="role-card user" onclick="goAuth('user')">
        <h2>🧍‍♂️ I Need Therapy</h2>
        <p>Find nearby physiotherapists and book sessions</p>
      </div>

      <div class="role-card physio" onclick="goAuth('physio')">
        <h2>🧑‍⚕️ I Do Therapy</h2>
        <p>Manage bookings, availability & earnings</p>
      </div>
    </div>
  </div>

<script>
  function goAuth(role) {
    location.href = `auth.html?role=${role}`;
  }
</script>

</body>
</html>
