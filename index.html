<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PhysioConnect</title>
  <link rel="stylesheet" href="styles.css" />

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="centered">

  <div class="card auth-card">
    <h1>PhysioConnect</h1>
    <p class="muted">Physiotherapy, simplified.</p>

    <!-- Role selection -->
    <div id="roleSelect">
      <button class="btn" onclick="selectRole('user')">
        I need therapy
      </button>
      <button class="btn secondary" onclick="selectRole('physio')">
        I do therapy
      </button>
    </div>

    <!-- Login / Register form -->
    <form id="authForm" style="display:none">
      <input type="text" id="name" placeholder="Full Name" required />
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />

      <button class="btn">Continue</button>
      <p class="muted small">New users will be registered automatically</p>
    </form>
  </div>

  <script src="firebase.js"></script>
  <script src="auth.js"></script>
</body>
</html>
