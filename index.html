<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Physio Home Visit Booking</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <h1>Physio-Connect</h1>
    <nav>
      <a href="#" onclick="goHome()">Home</a>
    </nav>
  </header>

  <!-- Hero -->
  <section class="hero">
    <h2>Physiotherapy Made Simple</h2>
    <p>Book or Register in just a few clicks..</p>
  </section>

  <!-- Choice Prompt -->
  <section id="choice" class="section">
    <h2>What are you here for?</h2>
    <div style="max-width:300px;margin:auto;">
      <button class="btn" onclick="showBooking()">Book a Physiotherapist</button>
      <button class="btn" style="margin-top:10px;background:#444" onclick="showRegister()">
        I am a Physiotherapist
      </button>
    </div>
  </section>

  <!-- Booking Section -->
  <section id="book" class="section" style="display:none;">
    <h2>Book a Home Visit</h2>

    <form class="card">
      <label>Full Name</label>
      <input type="text" placeholder="Enter your name" required />

      <label>Location</label>
      <input type="text" placeholder="Enter your address" required />

      <label>Date</label>
      <input type="date" required />

      <label>Time</label>
      <input type="time" required />

      <label>Condition</label>
      <select>
        <option>Back Pain</option>
        <option>Sports Injury</option>
        <option>Post Surgery Rehab</option>
        <option>Other</option>
      </select>

      <button type="submit" class="btn">Find Physiotherapist</button>
    </form>
  </section>

  <!-- Physio Registration -->
  <section id="register" class="section gray" style="display:none;">
    <h2>Physiotherapist Registration</h2>

    <form class="card">
      <label>Full Name</label>
      <input type="text" required />

      <label>Email</label>
      <input type="email" required />

      <label>Qualification</label>
      <input type="text" placeholder="BPT / MPT" required />

      <label>Specialization</label>
      <input type="text" placeholder="Ortho, Neuro, Sports" />

      <label>Price per Session</label>
      <input type="number" placeholder="Amount" />

      <label>Service Radius (km)</label>
      <input type="number" />

      <button type="submit" class="btn">Register</button>
    </form>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2026 PhysioConnect. All rights reserved.</p>
  </footer>

<script src="script.js"></script>
</body>
</html>
